<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1a73e8">
  <title>Staff Timeclock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f0f4f8; min-height: 100vh; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 420px; padding: 20px 16px 40px; }
    h1 { font-size: 22px; color: #1a2a3a; text-align: center; margin: 8px 0 2px; }
    .clock { text-align: center; font-size: 34px; font-weight: 700; color: #1a73e8; letter-spacing: 1px; }
    .date { text-align: center; color: #667; font-size: 14px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #445; margin: 14px 0 6px; }
    select, #pin { width: 100%; padding: 14px; font-size: 17px; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; }
    #pin { letter-spacing: 4px; }
    .fpstatus { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: none; }
    .fpstatus.yes { display: block; background: #e0f2fe; color: #075985; }
    .fpstatus.no { display: block; background: #fef3c7; color: #78350f; }
    .cam-box { margin-top: 14px; border-radius: 16px; overflow: hidden; background: #dde5ee; position: relative; aspect-ratio: 4/3; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
    .cam-hint { position: absolute; bottom: 8px; left: 8px; right: 8px; text-align: center; color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    .btns { display: flex; gap: 12px; margin-top: 18px; }
    button { flex: 1; padding: 18px 0; font-size: 18px; font-weight: 700; border: none; border-radius: 14px; color: #fff; cursor: pointer; }
    button:disabled { opacity: .45; }
    .in { background: #16a34a; }
    .out { background: #dc2626; }
    .reg { display: none; width: 100%; margin-top: 10px; padding: 14px 0; font-size: 15px; background: #7c3aed; }
    .finish { display: none; width: 100%; margin-top: 12px; padding: 16px 0; font-size: 16px; background: #0f766e; }
    .msg { margin-top: 16px; padding: 14px; border-radius: 12px; font-size: 15px; text-align: center; display: none; }
    .msg.ok { display: block; background: #dcfce7; color: #14532d; }
    .msg.err { display: block; background: #fee2e2; color: #7f1d1d; }
    .spin { display: none; text-align: center; margin-top: 16px; color: #1a73e8; font-weight: 600; }
    .slip-btns { display: flex; gap: 12px; }
    .slip-btns button { padding: 12px 0; font-size: 14px; background: #1a73e8; }
    .slip { margin-top: 14px; background: #fff; border-radius: 14px; padding: 14px; display: none; }
    .slip h3 { font-size: 16px; color: #1a2a3a; margin-bottom: 2px; }
    .slip .sub { font-size: 12px; color: #667; margin-bottom: 10px; }
    .slip table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .slip th, .slip td { border: 1px solid #dde3ec; padding: 5px 6px; text-align: left; }
    .slip th { background: #eef3fd; font-size: 11px; }
    .slip td.r, .slip th.r { text-align: right; }
    .slip .totals { margin-top: 10px; font-size: 13px; }
    .slip .totals div { display: flex; justify-content: space-between; padding: 3px 0; }
    .slip .gross { font-weight: 800; font-size: 16px; color: #16a34a; border-top: 2px solid #dde3ec; margin-top: 4px; padding-top: 8px !important; }
    .slip .warn { color: #b00020; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>⏱ Staff Timeclock</h1>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date"></div>

    <label for="staff">Who are you?</label>
    <select id="staff"><option value="">Loading staff…</option></select>

    <div class="fpstatus" id="fpstatus"></div>

    <label for="pin">Access code (PIN)</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="For payslip &amp; first-time setup">
    <button class="reg" id="btnReg" onclick="registerFingerprint()">👆 Register this phone's fingerprint</button>

    <div class="cam-box">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display:none"></canvas>
      <div class="cam-hint" id="camhint">Your selfie is captured when you punch</div>
    </div>
    <input type="file" id="file" accept="image/*" capture="user" style="display:none">

    <div class="btns">
      <button class="in" id="btnIn" onclick="punch('IN')" disabled>TIME IN</button>
      <button class="out" id="btnOut" onclick="punch('OUT')" disabled>TIME OUT</button>
    </div>
    <button class="finish" id="btnFinish" onclick="openCameraApp()">📷 Take selfie to finish</button>

    <div class="spin" id="spin">Working…</div>
    <div class="msg" id="msg"></div>

    <label>My Payslip</label>
    <div class="slip-btns">
      <button id="btnCur" onclick="viewSlip('current')" disabled>This Cutoff</button>
      <button id="btnPrev" onclick="viewSlip('previous')" disabled>Last Cutoff</button>
    </div>
    <div class="slip" id="slip"></div>
  </div>

  <script>
    // ===== Connection to the payroll spreadsheet (Google Apps Script API) =====
    const API = 'https://script.google.com/macros/s/AKfycby4eGmZETPPb7h1ZNXXNPTUg8A2sBZ2qc3jetNt4RtyaBDfJoleg2wDWmZDvkKX5UfI6A/exec';

    let staffList = [];
    let stream = null;
    let chal = null;          // { staffId, challenge, credIds, at }
    let pending = null;       // { type, assertion, pin } waiting for a selfie

    const $ = id => document.getElementById(id);

    function api(action, data) {
      return fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, data || {})) })
        .then(r => r.json());
    }

    // ---- clock ----
    function tick() {
      const n = new Date();
      $('clock').textContent = n.toLocaleTimeString();
      $('date').textContent = n.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(tick, 1000); tick();

    // ---- staff list ----
    function loadStaff() {
      api('staff').then(res => {
        staffList = res.staff || [];
        const sel = $('staff');
        const keep = sel.value;
        sel.innerHTML = '<option value="">— Select your name —</option>';
        staffList.forEach(s => {
          const o = document.createElement('option');
          o.value = s.id; o.textContent = s.name;
          sel.appendChild(o);
        });
        if (keep) sel.value = keep;
        onStaffChange(false);
      }).catch(e => showMsg('Could not load staff list. Check your internet and reload. (' + e.message + ')', false));
    }
    loadStaff();

    function currentStaff() { return staffList.find(s => s.id === $('staff').value) || null; }

    $('staff').addEventListener('change', () => onStaffChange(true));
    function onStaffChange(clear) {
      const s = currentStaff();
      if (clear) { $('pin').value = ''; $('slip').style.display = 'none'; $('msg').className = 'msg'; }
      pending = null; $('btnFinish').style.display = 'none';
      const has = !!s;
      ['btnIn', 'btnOut', 'btnCur', 'btnPrev'].forEach(id => $(id).disabled = !has);
      const st = $('fpstatus');
      if (!s) { st.className = 'fpstatus'; $('btnReg').style.display = 'none'; return; }
      if (!window.PublicKeyCredential) {
        st.className = 'fpstatus no';
        st.textContent = 'This browser does not support fingerprint. Please open this link in Chrome (Android) or Safari (iPhone).';
        $('btnReg').style.display = 'none';
        return;
      }
      if (s.fp) {
        st.className = 'fpstatus yes';
        st.textContent = '👆 Fingerprint registered — tap TIME IN / TIME OUT and scan your finger.';
        $('btnReg').style.display = 'none';
        prefetchChallenge();
      } else {
        st.className = 'fpstatus no';
        st.textContent = 'Fingerprint not set up yet. Enter your PIN, then tap “Register this phone’s fingerprint”.';
        $('btnReg').style.display = 'block';
      }
    }

    // A fresh challenge is fetched in advance so the fingerprint prompt opens
    // instantly when TIME IN / OUT is tapped (some phones require that).
    function prefetchChallenge() {
      const s = currentStaff();
      if (!s || !s.fp) return;
      api('challenge', { staffId: s.id }).then(res => {
        if (res.ok) chal = { staffId: s.id, challenge: res.challenge, credIds: res.credIds, at: Date.now() };
      });
    }
    setInterval(prefetchChallenge, 4 * 60 * 1000);

    // ---- base64url helpers ----
    function b64uToBuf(s) {
      s = s.replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      const bin = atob(s), out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function bufToB64u(buf) {
      const b = new Uint8Array(buf); let s = '';
      for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function toHex(bytes) { return Array.from(bytes).map(x => ('0' + x.toString(16)).slice(-2)).join(''); }

    // ---- fingerprint registration (one time per phone) ----
    function registerFingerprint() {
      const s = currentStaff();
      const pin = $('pin').value.trim();
      if (!s) return;
      if (!pin) { showMsg('Enter your PIN first, then tap Register.', false); return; }
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      navigator.credentials.create({ publicKey: {
        challenge: challenge,
        rp: { id: location.hostname, name: 'Staff Timeclock' },
        user: { id: new TextEncoder().encode(s.id), name: s.name, displayName: s.name },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        attestation: 'none', timeout: 60000
      } }).then(cred => {
        const resp = cred.response;
        if (!resp.getPublicKey || (resp.getPublicKeyAlgorithm && resp.getPublicKeyAlgorithm() !== -7)) {
          throw new Error('This phone’s browser is too old for fingerprint. Please update Chrome/Safari.');
        }
        const spki = new Uint8Array(resp.getPublicKey());
        const pt = spki.slice(spki.length - 65);
        if (pt[0] !== 4) throw new Error('Unsupported fingerprint key.');
        setBusy(true);
        return api('register', { staffId: s.id, pin: pin, credId: bufToB64u(cred.rawId),
          x: toHex(pt.slice(1, 33)), y: toHex(pt.slice(33, 65)) });
      }).then(res => {
        setBusy(false);
        showMsg(res.message || (res.ok ? 'Registered.' : 'Registration failed.'), res.ok);
        if (res.ok) { $('pin').value = ''; s.fp = true; onStaffChange(false); }
      }).catch(e => {
        setBusy(false);
        showMsg(e.name === 'NotAllowedError' ? 'Fingerprint registration was cancelled.' : ('Could not register: ' + e.message), false);
      });
    }

    // ---- camera ----
    async function startCam() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        $('video').srcObject = stream;
      } catch (e) {
        $('camhint').textContent = 'Camera preview unavailable — your camera app will open for the selfie.';
      }
    }
    startCam();

    function captureSelfie() {
      const video = $('video');
      if (!stream || !video.videoWidth) return null;
      const canvas = $('canvas');
      canvas.width = 480;
      canvas.height = Math.round(480 * video.videoHeight / video.videoWidth);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.7);
    }

    function openCameraApp() { const fi = $('file'); fi.value = ''; fi.click(); }
    $('file').addEventListener('change', function () {
      const f = this.files && this.files[0];
      if (!f || !pending) return;
      const img = new Image();
      img.onload = function () {
        const canvas = $('canvas');
        canvas.width = 480; canvas.height = Math.round(480 * img.height / img.width);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(img.src);
        $('btnFinish').style.display = 'none';
        sendPunch(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => showMsg('Could not read the photo. Please try again.', false);
      img.src = URL.createObjectURL(f);
    });

    // ---- punch ----
    function punch(type) {
      const s = currentStaff();
      if (!s) return;
      $('btnFinish').style.display = 'none';
      if (s.fp) {
        if (!chal || chal.staffId !== s.id || Date.now() - chal.at > 4 * 60 * 1000) {
          prefetchChallenge();
          showMsg('Getting ready… please tap ' + (type === 'IN' ? 'TIME IN' : 'TIME OUT') + ' again in 2 seconds.', false);
          return;
        }
        const c = chal; chal = null;
        navigator.credentials.get({ publicKey: {
          challenge: b64uToBuf(c.challenge),
          rpId: location.hostname,
          allowCredentials: c.credIds.map(id => ({ type: 'public-key', id: b64uToBuf(id), transports: ['internal'] })),
          userVerification: 'required', timeout: 60000
        } }).then(a => {
          pending = { type: type, pin: '', assertion: {
            credId: bufToB64u(a.rawId),
            clientDataJSON: bufToB64u(a.response.clientDataJSON),
            authenticatorData: bufToB64u(a.response.authenticatorData),
            signature: bufToB64u(a.response.signature)
          } };
          afterAuth();
        }).catch(e => {
          prefetchChallenge();
          showMsg(e.name === 'NotAllowedError' ? 'Fingerprint scan cancelled or not recognized. Please try again.' : ('Fingerprint error: ' + e.message), false);
        });
      } else {
        const pin = $('pin').value.trim();
        if (!pin) { showMsg('Please enter your PIN (or register your fingerprint).', false); return; }
        pending = { type: type, pin: pin, assertion: null };
        afterAuth();
      }
    }

    function afterAuth() {
      const selfie = captureSelfie();
      if (selfie) { sendPunch(selfie); return; }
      // No live camera: a second tap is needed to open the camera app
      $('btnFinish').style.display = 'block';
      showMsg(pending.assertion ? 'Fingerprint OK ✔ — now tap “Take selfie to finish”.' : 'Now tap “Take selfie to finish”.', true);
    }

    function sendPunch(selfie) {
      const s = currentStaff();
      if (!s || !pending) return;
      const p = pending; pending = null;
      setBusy(true);
      getLocation(loc => {
        api('punch', { staffId: s.id, type: p.type, selfie: selfie, loc: loc, pin: p.pin, assertion: p.assertion })
          .then(res => {
            setBusy(false);
            showMsg(res.message, res.ok);
            if (res.ok) $('pin').value = '';
            prefetchChallenge();
          })
          .catch(e => { setBusy(false); showMsg('Network error — punch NOT recorded. Please try again. (' + e.message + ')', false); prefetchChallenge(); });
      });
    }

    function getLocation(cb) {
      if (!navigator.geolocation) return cb(null);
      let done = false;
      const finish = l => { if (!done) { done = true; cb(l); } };
      navigator.geolocation.getCurrentPosition(
        pos => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }),
        () => finish(null),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
      setTimeout(() => finish(null), 9000);
    }

    function setBusy(b) {
      $('spin').style.display = b ? 'block' : 'none';
      ['btnIn', 'btnOut', 'btnReg'].forEach(id => $(id).disabled = b);
      if (!b) { const has = !!currentStaff(); $('btnIn').disabled = !has; $('btnOut').disabled = !has; }
    }

    function showMsg(text, ok) { const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

    // ---- payslip (PIN protected) ----
    function viewSlip(which) {
      const s = currentStaff();
      if (!s) return;
      const pin = $('pin').value.trim();
      const el = $('slip');
      el.style.display = 'block';
      if (!pin) { el.innerHTML = '<div style="color:#b00020">Please enter your access code to view your payslip.</div>'; return; }
      el.innerHTML = '<div style="text-align:center;color:#1a73e8;font-weight:600">Loading payslip…</div>';
      api('payslip', { staffId: s.id, which: which, pin: pin })
        .then(renderSlip)
        .catch(e => { el.innerHTML = '<div style="color:#b00020">Error: ' + esc(e.message) + '</div>'; });
    }

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function renderSlip(p) {
      const el = $('slip');
      if (!p.ok) { el.innerHTML = '<div style="color:#b00020">' + esc(p.message || 'Could not load payslip.') + '</div>'; return; }
      if (!p.days.length) {
        el.innerHTML = '<h3>' + esc(p.name) + '</h3><div class="sub">' + esc(p.cutoff) + '</div><div>No punches recorded in this cutoff yet.</div>';
        return;
      }
      let rows = '';
      p.days.forEach(d => {
        rows += '<tr><td>' + esc(d.date.slice(5)) + (d.tag ? ' <b style="color:#b45309">' + esc(d.tag) + '</b>' : '') + '</td><td>' + esc(d.in) + '</td><td>' + esc(d.out) + '</td>' +
          '<td class="r">' + (d.note ? '<span style="color:#b00020">' + esc(d.note) + '</span>' : d.hours.toFixed(2)) + '</td>' +
          '<td class="r">' + (d.note ? '' : d.ot.toFixed(2)) + '</td></tr>';
      });
      let lines =
        '<div><span>Days worked</span><span>' + p.daysWorked + '</span></div>' +
        '<div><span>Regular: ' + p.regHours.toFixed(2) + ' h × ₱' + p.rate.toFixed(2) + '</span><span>₱' + p.regPay.toFixed(2) + '</span></div>' +
        '<div><span>OT: ' + p.otHours.toFixed(2) + ' h × ₱' + p.rate.toFixed(2) + ' × ' + p.otMult + '</span><span>₱' + p.otPay.toFixed(2) + '</span></div>';
      if (p.rhHours > 0) lines += '<div><span>Reg. holiday: ' + p.rhHours.toFixed(2) + ' h × ' + (p.rhMult * 100) + '%' + (p.rhOTHours > 0 ? ' (+' + p.rhOTHours.toFixed(2) + 'h OT)' : '') + '</span><span>₱' + p.rhPay.toFixed(2) + '</span></div>';
      if (p.shHours > 0) lines += '<div><span>Spec. holiday: ' + p.shHours.toFixed(2) + ' h × ' + (p.shMult * 100) + '%' + (p.shOTHours > 0 ? ' (+' + p.shOTHours.toFixed(2) + 'h OT)' : '') + '</span><span>₱' + p.shPay.toFixed(2) + '</span></div>';
      if (p.unworkedRH > 0) lines += '<div><span>Unworked reg. holiday × ' + p.unworkedRH + '</span><span>₱' + p.unworkedRHPay.toFixed(2) + '</span></div>';
      lines += '<div><span>Late / undertime</span><span>' + p.lateMin + ' / ' + p.underMin + ' min</span></div>' +
        '<div class="gross"><span>GROSS PAY</span><span>₱' + p.grossPay.toFixed(2) + '</span></div>';
      el.innerHTML = '<h3>' + esc(p.name) + '</h3>' +
        '<div class="sub">Cutoff: ' + esc(p.cutoff) + ' &nbsp;•&nbsp; Rate: ₱' + p.rate.toFixed(2) + '/hr</div>' +
        '<table><tr><th>Date</th><th>In</th><th>Out</th><th class="r">Hrs</th><th class="r">OT</th></tr>' + rows + '</table>' +
        (p.days.some(d => d.tag) ? '<div style="font-size:10px;color:#889;margin-top:3px">RH = regular holiday, SNH = special non-working</div>' : '') +
        '<div class="totals">' + lines + '</div>' +
        (p.incomplete ? '<div class="warn">' + p.incomplete + ' day(s) missing IN or OUT — not counted. Ask admin to fix TimeLog.</div>' : '');
      $('pin').value = '';
    }
  </script>
</body>
</html>
